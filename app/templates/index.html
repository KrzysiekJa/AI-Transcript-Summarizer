<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <title>AI Transcript Summarizer</title>
  </head>
  <body class="bg-black text-white min-h-screen flex flex-col items-center">
    <header
      class="w-full max-w-6xl px-6 py-6 flex items-center justify-between"
    >
      <h1 class="text-2xl font-semibold">AI Transcript Summarizer</h1>
    </header>

    <main class="w-full max-w-6xl px-6 pb-12">
      <section aria-label="Episodes" class="space-y-4">
        <h2 class="text-lg font-medium">Episodes</h2>

        {% if episodes %}
        <div class="flex flex-col space-y-4 max-h-96 overflow-y-auto py-4">
          {% for episode in episodes %}
          <article
            class="w-full h-60 bg-gray-900 border border-gray-800 rounded-lg p-4 shadow-sm"
          >
            <h3 class="text-white text-lg font-semibold mb-2 truncate">
              {{ episode.title }}
            </h3>
            <p class="text-gray-300 text-sm mb-3">
              {{ episode.summary|default('', true)|truncate(160, true, '...') }}
            </p>
            <div
              class="text-xs text-gray-400 flex items-center justify-between"
            >
              {% if episode.url %}
              <div class="w-full flex justify-end mt-auto">
                <a
                  href="{{ episode.url }}"
                  class="text-indigo-400"
                  aria-label="Listen"
                  >Listen</a
                >
              </div>
              {% endif %}
            </div>
          </article>
          {% endfor %}
        </div>
        {% else %}
        <p class="text-gray-400">No episodes available.</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
